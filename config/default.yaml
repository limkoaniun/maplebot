# maplebot default configuration.
# Do not edit this file; copy config/user.example.yaml to config/user.yaml and override there.

system:
  fps_main: 12          # vision/decision loop rate
  fps_keyboard: 30      # keyboard controller thread rate
  fps_capture: 15       # window capture thread rate
  debounce_s: 1.0       # hotkey debounce

game_window:
  title: "MapleStory"   # substring of the game window title
  title_bar_px: 0       # rows to crop from the top of the captured window
  working_size: null    # [w, h] to resize frames to, or null to keep native size

keys:
  left: left
  right: right
  up: up
  down: down
  jump: space
  attack: w             # directional / basic attack
  aoe: q                # AoE skill, "" to disable
  teleport: ""          # mage teleport, "" to use jump instead
  hp_potion: "1"
  mp_potion: "2"
  pickup: ""            # "" to disable periodic pickup while moving
  pickup_interval_s: 0.3

buffs:
  keys: []              # e.g. ["a", "s"]
  cooldowns_s: []       # seconds per key, same order
  freeze_s: 1.0         # stop moving/attacking this long after casting

player:
  locator: party_bar    # party_bar | nametag | appearance
  box_w: 100            # the character's own footprint, ignored in monster search
  box_h: 150
  party_bar:
    lower_hsv: [0, 60, 60]     # H 0-360, S 0-100, V 0-100
    upper_hsv: [0, 100, 100]
    offset: [20, 66]           # from bar top-left to character centre
    min_h: 5
    max_h: 7
    max_w: 50
  nametag:
    path: ""                   # PNG of your nametag, green (0,255,0) background
    offset: [0, -30]
    diff_thres: 0.2
    split_width: 30
  appearance:
    path: ""                   # PNG crop of your character
    match_thres: 0.85
    search_radius: 140
    feet_offset: [0, -6]

minimap:
  fixed_rect: null             # [x, y, w, h] to skip auto detection
  player_color_bgr: [136, 255, 255]
  player_tolerance: 8
  other_color_bgr: [0, 0, 255]
  max_jump_px: 30
  width_bound_pct: 0.0         # 0 = off; 0.6 keeps the player in the middle 60% of the minimap

monsters:
  dir: monster
  names: []                    # folders under monsters.dir to load; empty = all
  mode: color                  # color | grayscale
  diff_thres: 0.25
  scales: [1.0]
  min_color_spread: 30
  max_matches_per_template: 50
  hp_bar:
    enable: false
    color_bgr: [71, 204, 64]
    tolerance: 10
  per_monster: {}              # name: {diff_thres: 0.3, scales: [1.1], min_color_spread: 0}

attack:
  mode: directional            # directional | aoe
  range_x: 350
  range_y: 70
  aoe_range_x: 400
  aoe_range_y: 170
  cooldown_s: 0.9
  aoe_cooldown_s: 1.0
  aoe_monster_count: 3         # use the AoE key when at least this many monsters are visible
  search_margin: 50
  min_overlap_px: 1500
  tie_margin_px: 50
  deadzone_px: 30              # stop walking toward a target closer than this
  surface:                     # same-surface test for circuit maps with drawn platforms
    enabled: false             # true: a target's sprite bottom must rest on the player's own platform surface
    feet_offset_px: 12         # player fix to feet, screen px (same-floor sprite bottoms sit here)
    above_px: 32               # accepted height above the expected surface (hops, uphill treads)
    below_px: 22               # accepted depth below it; deeper means another stair/floor underneath
  # The expected surface follows slopes: (platform height at the monster - height at the player)
  # * route.circuit.pixels_per_minimap_y (defaults to pixels_per_minimap_x).
  # pre_transition_s: 0        # 0 = off. Seconds (0-10) per jump/ramp/drop waypoint the bot may spend
  #                            # attacking a fresh in-range monster on its own surface BEFORE the takeoff
  #                            # key: while lining up, settling, or re-aligning after a failed attempt.
  #                            # It only turns and attacks there (no walking toward the target); a short
  #                            # detection gap (up to 0.4 s) waits without keys and is charged too. Once the
  #                            # takeoff key is out, on a rope, or returning to point 1, the transition
  #                            # keeps absolute priority, as it does when the allowance is spent.
  #                            # Not live-verified.

# Optional loot keys (the `loot:` section is absent by default; see maplebot/nav/loot.py):
#   walk_speed_x: 0    minimap px/s while a key is held, as an upper bound. > 0 sizes each leased
#                      approach pulse from the remaining distance (capped 0.5 s, 1 px short of the
#                      outward edge) instead of fixed 0.04 s taps.
#   max_pending: 0     1-4 remembers kill sites displaced by a newer target for one later bounded
#                      visit on the same platform; pending_s (8) is how long a site stays valid and
#                      switch_x (2.5 minimap px) is the jump that marks a changed target.
#                      max_pending needs walk_speed_x, so every walk-back is leased.
# Optional route.circuit approach keys (maplebot/nav/circuit.py, walk waypoints only; absent = off):
#   approach_fine_radius_x   inner radius that keeps the fine approach_pulse_s taps; setting it turns
#                            distance-sized leased pulses on between it and approach_radius_x
#   approach_walk_speed_x    held walking speed in minimap px/s. Must be an UPPER bound on the real
#                            speed (Construction Site measured 9.2-9.8), or pulses overshoot
#   approach_stop_margin_x   a pulse aims this far short of the waypoint (default 1.0)
#   approach_edge_margin_x   and this far short of the platform edge; must be >= stop margin + 0.75
#   approach_far_pulse_max_s cap per pulse (default 0.4, at most 0.6)
#   approach_far_release_s   release after such a pulse (default approach_release_s)
#   approach_resume_credit   true: release already served before a combat/loot interruption counts
#   Jump, ramp, drop and climb alignment and every return-to-start route keep the fine taps
#   unless the transition-timing keys below opt in.
# Optional route.circuit transition-timing keys (maplebot/nav/circuit.py; all OFF when absent).
# Offline-tested only (tests/test_transition_timing.py), NOT live-verified. They change no
# takeoff tolerance, support test, landing proof, settle time, lease or retry count. A saved map
# profile needs them in its circuit_settings too. Enable one key per supervised run, A first.
#   commit_budget: false          true: once a transition is physically under way (ramp started,
#                                 Jump sent, Down+Jump sent or a fall seen, on the rope by minimap
#                                 height) the waypoint clock timeout_s no longer cuts it. It ends by
#                                 its own budget from the takeoff; a fall or a rope also after
#                                 transition_stall_s without one more whole pixel of progress
#                                 ("drop stalled"; a rope takes the existing retry / "waypoint
#                                 timeout" path). A ramp has no such rule: a verified lap stood 5 s
#                                 on a stair with the key held and then walked up. Time before the
#                                 takeoff (waiting, aligning, settling, re-aligning) is still bounded
#                                 by timeout_s. Read only when true:
#     ramp_travel_timeout_s         per ramp takeoff (2-30, default timeout_s clamped into that
#                                   range), plus the landing dwell while it is proven
#     drop_fall_timeout_s: 6        per launch or observed fall (2-30), plus the landing dwell
#     climb_travel_timeout_s        rope time per waypoint selection (2-60, default timeout_s
#                                   clamped into that range); leaving and re-entering the rope
#                                   does not renew it
#     landing_confirm_timeout_s: 3  a jump that stands at its landing but never holds still fails
#                                   this long after jump_flight_timeout_s (1-10), plus its dwell
#     transition_stall_s: 2         no-progress limit on a fall or a rope (1-5); not on a ramp
#   takeoff_far_approach: false   true: jump, ramp, drop and rope takeoff alignment may use the
#                                 distance-sized leased pulses above, only while a fresh frame is
#                                 strictly on the SOURCE platform. A pulse is sized from the floor
#                                 beyond the takeoff point, so that even one started on the takeoff
#                                 point would stop approach_edge_margin_x before that platform's
#                                 end. A takeoff closer to the end ahead than that margin plus one
#                                 fine tap (the gap jumps, 2 px from the gap) keeps fine taps in
#                                 that direction. Inside approach_fine_radius_x the fine taps
#                                 finish; the takeoff tolerance and align_settle_s on aligned
#                                 frames are unchanged. Needs the approach_fine_radius_x keys.
#   recovery_far_approach: false  true: return-to-start and platform-rejoin routes may use far pulses
#                                 for their walk legs (and for takeoffs when takeoff_far_approach is
#                                 also true). They never use approach_resume_credit. Needs the
#                                 approach_fine_radius_x keys. A return still never fights.
# route.circuit regain-support stage (maplebot/nav/regain.py; code defaults apply when absent).
# Runs before a return to point 1 is planned (Resume, Return to point 1, blocked-route recovery)
# when the character is on no drawn platform. Offline-tested only, NOT live-verified.
#   return_regain_support: true   false keeps the old behaviour: wait 3 s, then guarded HP Hold
#   regain_timeout_s: 20          active seconds for the whole stage (5-30); it also counts
#                                 inside return_timeout_s
#   regain_max_walk_x: 16         furthest it may walk from where it stood, minimap px (4-40)
#   It only sends short leased Left/Right pulses (<= 0.25 s) inside the drawn floor underneath,
#   or Down on a saved rope; never Up or Jump. Any failure ends in guarded HP Hold.
#   Last resort, only after Left and Right pulses both moved nothing and one drawn floor lies
#   underneath (e.g. a rope the map does not draw): Down alone, leased <= 0.3 s per fresh frame,
#   ended after 1.5 s without descent. Down descends a rope and releases at its bottom, only
#   crouches on a solid surface, and does not enter portals (Up does). NOT live-verified.
#   A direction with under 2 px of room is pulsed for its whole 6 s leg before it counts as
#   "moved nothing"; a changed position gets its own Left/Right pulses before any Down.
# route.circuit wrong-platform handling (maplebot/nav/circuit.py, maplebot/nav/recovery.py).
# Both keys are OFF when absent, need the saved editor plan, and are ignored by editor
# connection tests and by return/rejoin routes. Offline-tested only, NOT live-verified.
# A saved map profile recompiles route.circuit from its circuit_settings, so for live use
# the keys belong in the profile's circuit_settings as well.
#   arrive_on_destination: false      true: a jump waypoint whose character already stands
#                                     on the jump's saved destination platform (knocked across
#                                     a narrow gap) is accepted without pressing Jump, after
#                                     3 fresh frames / 0.5 s of strict support there, a
#                                     precision walk to the landing X, then the normal landing
#                                     proof with the 0.65 s no-descent dwell. Jump only.
#                                     The same knock during the walk waypoint(s) leading to
#                                     that jump's takeoff, on the takeoff platform, hands over
#                                     to the jump waypoint after the same 3-frame proof; those
#                                     remaining takeoff walks are then not visited.
#   platform_rejoin: false            true: a walk, jump or ramp waypoint whose character is
#                                     stably (3 fresh frames / 0.5 s / 0.5 px) on another drawn
#                                     platform walks the shortest saved connections back to the
#                                     waypoint's platform (walk) or takeoff (jump, ramp). The
#                                     waypoint index never changes; no return to point 1 is spent.
#   max_platform_rejoins_per_lap: 3   started rejoins per lap (1-5); only a completed lap resets it
#   platform_rejoin_timeout_s: 20     stepped seconds per rejoin (5-60). A flight, ramp or rope
#                                     already under way is never cut; it ends by its own proof
#                                     or block first.
#   platform_rejoin_max_transitions: 1  connections a rejoin path may use (1-4). 20 s fits one
#                                     connection; raise the timeout together with this value.
#   No combat or loot runs during a rejoin. A failed, timed-out or unplannable rejoin is not a
#   block: the waypoint keeps its own timeout, then the usual return/Hold follows. Only when
#   the rejoin ends with the character already on the waypoint's platform does the waypoint
#   get a fresh timeout window (its retries stay spent). On the Construction Site, floor-3 ->
#   floor-3-right and floor-4 -> floor-4-right have no saved path within 2 connections (there
#   is no floor-3-return / floor-4-return jump); arrive_on_destination covers that knock. Positions
#   that are unsupported or on two overlapping drawn platforms (x=89 on the Construction Site
#   right floors) keep the old wait. The older fall-to-a-lower-floor rejoin keeps precedence.

route:
  dir: minimaps
  map: ""                      # folder under route.dir; empty = no route (sweep search instead)
  search_range: 10
  miss_grace_frames: 15
  ladder_complement_dist: 3
  color_code:                  # RGB -> "move_x move_y action"
    "255,0,0": "left none none"
    "0,0,255": "right none none"
    "255,127,0": "left none jump"
    "0,255,255": "right none jump"
    "127,255,0": "none down jump"
    "255,0,255": "none none jump"
    "0,255,127": "stop stop none"
    "255,255,0": "none none goal"
    "255,0,127": "none up teleport"
    "127,0,255": "none down teleport"
    "0,127,0": "left none teleport"
    "139,69,19": "right none teleport"
  color_code_up_down:
    "127,127,127": "none up none"
    "255,255,127": "none down none"

health:
  enable: true
  hp_percent: 60
  minimum_hp_percent: 50
  protect_on_route_failure: true
  protection_retry_s: 1.0
  protection_max_taps: 3
  mp_percent: 30
  rearm_delta: 5
  retry_s: 2.0
  max_retries: 5               # after this many retries without recovery, slow down to one try per backoff_s
  backoff_s: 30.0
  warmup_reads: 10
  ui_y_start: 610              # rows below this are the bottom UI strip
  fixed_rects: null            # [[x,y,w,h] hp, [x,y,w,h] mp, [x,y,w,h] exp] relative to full frame
  bar_white_thresh: 240

stuck:
  enable: true
  range_px: 10
  timeout_s: 6.0
  recover_s: 2.0

search:
  enable: true
  trigger_frames: 4
  flip_frames: 40              # frames before the sweep turns around
  max_offset_px: 0             # turn around after walking this far from the start (0 = off)
  stall_frames: 0              # 0 = off; the minimap dot moves < 1px/frame while walking, so a small value misfires
  attack_while_moving: false   # attacking stops the character each swing; the bot attacks when a target is in range anyway

debug:
  show: true
  scale: 0.6
  route_zoom: 3

# On-screen gain evidence (maplebot/evidence.py, maplebot/vision/gains.py). Telemetry only: it never
# sends input and never changes a decision. The counters are observations of the HUD on fresh frames
# of the recognised map - lower bounds on gain events, not exact kill, meso or item counts.
# LAYOUT-SPECIFIC: every rect and both templates were measured on the 1366x768 prepared frame of the
# Construction Site run (15 Nov 2026). A different resolution, UI scale or HUD layout needs new rects
# and templates; a rect that does not fit the frame reports its counters as null, not 0.
evidence:
  enabled: false               # true: track and publish an 'evidence' dict in log/active-status.json
  exp_text_rect: [738, 737, 107, 14]   # [x, y, w, h] of the digits "5,192 [95.09%]" above the EXP bar
  exp_text_pixel_delta: 24     # a pixel "changed" when its largest channel difference exceeds this
  exp_text_min_pixels: 10      # changed pixels for "the EXP text changed" (measured: 0 unchanged, 27-168 changed)
  gain_line_rect: [1150, 604, 214, 16] # newest (bottom) gain notification line, right-aligned near x=1358
  gain_line_pitch: 14          # older lines sit this many rows higher
  gain_line_slots: 3           # slots watched (2-4); 3 can prove two lines arriving between two captures
  gain_line_fresh_pixels: 40   # outlined-white pixels for a fresh line (measured 40-213)
  gain_line_empty_pixels: 15   # below this the slot counts as empty (measured empty <= 8)
  gain_line_shift_score: 0.45  # similarity for "the previous newest line is now one slot up" (measured 0.50-0.85);
                               # also: a line this similar to what its slot showed one capture earlier is not new
  gain_line_shift_margin: 0.15 # ...and it must beat the same comparison one capture earlier by this much
  exp_line_score: 0.5          # prefix template score for an EXP line (measured 0.49-1.00 true, <= 0.41 otherwise);
                               # the weakest measured true lines (0.49) fall to 'other', the conservative outcome
  meso_line_score: 0.45        # prefix template score for a meso line (measured 0.52-1.00 true, <= 0.35 otherwise)
  templates:                   # "You received EXP (" / "You have gained mesos (" crops, relative to the repo root
    exp: assets/gain-line-exp-prefix.png
    meso: assets/gain-line-meso-prefix.png
  max_gap_s: 2.0               # a longer gap between fresh frames drops the comparison baselines
  max_dt_s: 1.0                # per-frame cap on seconds added to an activity bucket
