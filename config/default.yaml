# maplebot default configuration.
# Do not edit this file; copy config/user.example.yaml to config/user.yaml and override there.

system:
  fps_main: 12          # vision/decision loop rate
  fps_keyboard: 30      # keyboard controller thread rate
  fps_capture: 15       # window capture thread rate
  debounce_s: 1.0       # hotkey debounce

game_window:
  title: "MapleStory"   # substring of the game window title
  title_bar_px: 0       # rows to crop from the top of the captured window
  working_size: null    # [w, h] to resize frames to, or null to keep native size

keys:
  left: left
  right: right
  up: up
  down: down
  jump: space
  attack: w             # directional / basic attack
  aoe: q                # AoE skill, "" to disable
  teleport: ""          # mage teleport, "" to use jump instead
  hp_potion: "1"
  mp_potion: "2"
  pickup: ""            # "" to disable periodic pickup while moving

buffs:
  keys: []              # e.g. ["a", "s"]
  cooldowns_s: []       # seconds per key, same order
  freeze_s: 1.0         # stop moving/attacking this long after casting

player:
  locator: party_bar    # party_bar | nametag | appearance
  box_w: 100            # the character's own footprint, ignored in monster search
  box_h: 150
  party_bar:
    lower_hsv: [0, 60, 60]     # H 0-360, S 0-100, V 0-100
    upper_hsv: [0, 100, 100]
    offset: [20, 66]           # from bar top-left to character centre
    min_h: 5
    max_h: 7
    max_w: 50
  nametag:
    path: ""                   # PNG of your nametag, green (0,255,0) background
    offset: [0, -30]
    diff_thres: 0.2
    split_width: 30
  appearance:
    path: ""                   # PNG crop of your character
    match_thres: 0.85
    search_radius: 140
    feet_offset: [0, -6]

minimap:
  fixed_rect: null             # [x, y, w, h] to skip auto detection
  player_color_bgr: [136, 255, 255]
  player_tolerance: 8
  other_color_bgr: [0, 0, 255]
  max_jump_px: 30
  width_bound_pct: 0.0         # 0 = off; 0.6 keeps the player in the middle 60% of the minimap

monsters:
  dir: monster
  names: []                    # folders under monsters.dir to load; empty = all
  mode: color                  # color | grayscale
  diff_thres: 0.25
  scales: [1.0]
  min_color_spread: 30
  max_matches_per_template: 50
  hp_bar:
    enable: false
    color_bgr: [71, 204, 64]
    tolerance: 10
  per_monster: {}              # name: {diff_thres: 0.3, scales: [1.1], min_color_spread: 0}

attack:
  mode: directional            # directional | aoe
  range_x: 350
  range_y: 70
  aoe_range_x: 400
  aoe_range_y: 170
  cooldown_s: 0.9
  aoe_cooldown_s: 1.0
  aoe_monster_count: 3         # use the AoE key when at least this many monsters are visible
  search_margin: 50
  min_overlap_px: 1500
  tie_margin_px: 50
  deadzone_px: 30              # stop walking toward a target closer than this

route:
  dir: minimaps
  map: ""                      # folder under route.dir; empty = no route (sweep search instead)
  search_range: 10
  miss_grace_frames: 15
  ladder_complement_dist: 3
  color_code:                  # RGB -> "move_x move_y action"
    "255,0,0": "left none none"
    "0,0,255": "right none none"
    "255,127,0": "left none jump"
    "0,255,255": "right none jump"
    "127,255,0": "none down jump"
    "255,0,255": "none none jump"
    "0,255,127": "stop stop none"
    "255,255,0": "none none goal"
    "255,0,127": "none up teleport"
    "127,0,255": "none down teleport"
    "0,127,0": "left none teleport"
    "139,69,19": "right none teleport"
  color_code_up_down:
    "127,127,127": "none up none"
    "255,255,127": "none down none"

health:
  enable: true
  hp_percent: 50
  mp_percent: 30
  rearm_delta: 5
  retry_s: 2.0
  warmup_reads: 10
  ui_y_start: 610              # rows below this are the bottom UI strip
  fixed_rects: null            # [[x,y,w,h] hp, [x,y,w,h] mp, [x,y,w,h] exp] relative to full frame
  bar_white_thresh: 240

stuck:
  enable: true
  range_px: 10
  timeout_s: 6.0
  recover_s: 2.0

search:
  enable: true
  trigger_frames: 4
  flip_frames: 40
  max_offset_px: 0
  stall_frames: 8
  attack_while_moving: true

debug:
  show: true
  scale: 0.6
  route_zoom: 3
