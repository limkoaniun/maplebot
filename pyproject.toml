[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maplebot"
version = "0.1.0"
description = "Pure-vision MapleStory auto-leveling bot"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
    "opencv-python>=4.8; sys_platform == 'win32'",
    "mss>=9; sys_platform == 'win32'",
    "pynput>=1.7; sys_platform == 'win32'",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "opencv-python-headless>=4.8"]

[project.scripts]
maplebot = "maplebot.__main__:main"

[tool.setuptools.packages.find]
include = ["maplebot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
